/* BGM catalog: compact three-level chooser with a preview right at the selected song. */

function sessionForRoom(code){var key='mfm_guest_'+code;try{var old=sessionStorage.getItem(key);if(old&&/^[a-z0-9-]{15,80}$/i.test(old))return old;var b=new Uint8Array(20);if(window.crypto&&window.crypto.getRandomValues)window.crypto.getRandomValues(b);else for(var i=0;i<b.length;i++)b[i]=Math.floor(Math.random()*256);var id=Array.from(b).map(function(v){return v.toString(16).padStart(2,'0')}).join('');sessionStorage.setItem(key,id);return id}catch(e){return Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)}}
function clearRetryTimer(){if(APP.retryTimer){clearTimeout(APP.retryTimer);APP.retryTimer=null}}

 p.on('error',function(e){if(APP.peer!==p)return;if(e&&e.type==='browser-incompatible')toast('此瀏覽器不支援多人連線，請改用 Safari 或 Chrome');if(e&&e.type==='peer-unavailable'){if(APP.conn){try{APP.conn.close()}catch(z){}}APP.conn=null}queueGuestRetry(false)});

function connectGuest(){var p=APP.peer;if(!p||!p.open||p.disconnected||APP.host)return;

 var c;try{c=p.connect('mindfm-'+APP.code,{reliable:true})}catch(e){queueGuestRetry(false);return}

 function lost(){clearTimeout(connectionTimer);if(APP.conn!==c)return;APP.conn=null;APP.busy=false;queueGuestRetry(false)}

function hostPeer(p){APP.peer=p;

function joinRoom(){if(APP.busy)return;var code=(el('#joinCode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);saveName(el('#joinName').value);if(code.length!==6){toast('請輸入 6 位房間代碼');return}if(typeof Peer==='undefined'){toast('連線套件尚未載入');return}

function connectionClosed(id,c){if(!APP.g||!APP.host||APP.connections[id]!==c)return;delete APP.connections[id];

 if(gm.result&&gm.result.gains&&Object.prototype.hasOwnProperty.call(gm.result.gains,oldId)){gm.result.gains[newId]=gm.result.gains[oldId];delete gm.result.gains[oldId]}
}

function renderLibraryPanel(inRoom){return '<section class="library '+(inRoom?'':'panel')+'" id="librarySection"><div class="space" style="flex-wrap:wrap"><h2>♫ 我的永久曲庫</h2><span class="library-stat">已收藏 '+APP.library.length+' 首 · 不用每次重加</span></div><p class="hint">歌曲保存在這台裝置的瀏覽器內。開新房會自動帶入你的曲庫；想換裝置，請用「匯出備份／匯入備份」。 所有曲風都會使用每首歌固定的 25 秒預設片段。你可以在下方搜尋歌曲，手動改為副歌、前奏等 15～40 秒片段；古典錄音還可以另外標記各樂章的開始時間。</p>'+(inRoom?'<p class="hint">本房間目前 '+(APP.view?APP.view.tracks.length:APP.g.tracks.length)+' 首。朋友匯入的曲目只屬於這個房間，若想保留可按「保存房間歌曲」。</p>':'')+'<div class="librarygrid"><div class="librarybox"><p class="fieldlabel">① 整批貼上歌曲網址</p><p class="hint">一行一首：<b>歌名 | YouTube 網址</b>。也可以只貼一排網址，歌名會暫時以編號顯示。</p><select id="bulkGenre" class="field">'+libraryGenreOptions()+'</select><textarea id="bulkText" class="field" rows="5" placeholder="周杰倫 - 晴天 | https://www.youtube.com/watch?v=XXXXXXXXXXX&#10;https://youtu.be/YYYYYYYYYYY&#10;...最多可收 500 首"></textarea><div class="library-tools"><button class="btn small" onclick="importBulkText()">加入我的曲庫 ＋</button></div></div><div class="librarybox"><p class="fieldlabel">② 從 YouTube 播放清單匯入（Beta）</p><p class="hint">貼上公開 YouTube 播放清單網址，使用官方播放器嘗試取得每支影片，再加入曲庫。私人播放清單或無法嵌入的影片可能不支援。</p><select id="playlistGenre" class="field">'+libraryGenreOptions()+'</select><input class="field" id="playlistURL" placeholder="https://www.youtube.com/playlist?list=PL..."/><div class="library-tools"><button class="btn small alt" id="playlistBtn" onclick="importYouTubePlaylist()">讀取整份播放清單 ↗</button></div><div class="hidden playlistpreview" id="playlistPreview"><div class="hint" id="playlistStatus">正在讀取播放清單...</div><div id="ytPlaylistPlayer"></div></div></div></div><div class="librarybox" style="margin-top:15px"><p class="fieldlabel">③ 替任何歌曲設定固定精華片段</p><p class="hint">K-pop、華語、西洋、古典都可以。找歌手或歌名，點「編輯」，選開始時間和 15～40 秒長度；以後開房會沿用。BGM 試聽、臥底揭曉和雙人默契都適用。</p><div class="clip-search-row"><input id="clipSearch" class="field" placeholder="例如：IVE、周杰倫、蕭邦、Bruno Mars" onkeydown="if(event.key===&quot;Enter&quot;){ev function saveAddedTracks(tracks){var seen=new Set(APP.library.map(function(t){return t.src})),added=[];tracks.forEach(function(item){var t=cleanSavedTrack(item);if(t&&!seen.has(t.src)&&APP.library.length<500){APP.library.push(t);seen.add(t.src);added.push(t)}});if(added.length){persistLibrary();if((APP.g||APP.view)&&!(APP.view&&APP.view.game))send({type:'bulkAdd',tracks:added});display()}return added.length}
function importBulkText(){var field=el('#bulkText'),genre=el('#bulkGenre')?.value||'西洋',lines=(field?.value||'').split(/\r?\n/).map(function(x){return x.trim()}).filter(Boolean);if(!lines.length){toast('先貼上多個 YouTube 影片網址，一行一首');return}var songs=[],skipped=0;lines.forEach(function(line,i){var m=line.match(/(?:https?:\/\/)?(?:www\.|m\.|music\.)?(?:youtube\.com|youtu\.be|youtube-nocookie\.com)\/[^\s|，]+/i);if(!m){skipped++;return}var url=m[0];if(!/^https?:\/\//.test(url))url='https://'+url;var id=parseSong(url);if(!id){skipped++;return}var title=line.replace(m[0],'').replace(/^[\s|－–—,:：-]+|[\s|－–—,:：-]+$/g,'').trim();songs.push({src:id,kind:'youtube',genre:genre,title:title||'YouTube · '+id})});var n=saveAddedTracks(songs);toast('已收藏 '+n+' 首'+(skipped?'；略過 '+skipped+' 行':'')+'。下次開房會自動帶入。');if(n)fillMissingTitles(songs.map(function(x){return x.src}).filter(function(x){return APP.library.some(function(y){return y.src===x&&y.title.startsWith('YouTube · ')})}))}
function renameSavedSong(src){var t=APP.library.find(function(t){return t.src===src});if(!t)return;var n=prompt('更改歌曲名稱',t.title);if(n!==null&&n.trim()){t.title=n.trim().slice(0,110);persistLibrary();display()}}
function editMovementMarks(src){var t=APP.library.find(function(x){return x.src===src});if(!t||t.genre!=='古典')return;
var previous=(t.chapters||[]).map(function(x){return x.label+'='+mfmClock(x.start)}).join('; ');
var value=prompt('替這支演奏影片標註各樂章開始秒數：\n第一樂章=00:00; 第二樂章=09:30; 第三樂章=18:10\n（時間必須依照這支影片實際錄音填寫，留空可清除）',previous);
if(value===null)return;var out=[],bad=false;value.trim().split(/[;；\n]+/).filter(Boolean).slice(0,12).forEach(function(row){var at=row.indexOf('=');if(at<=0){bad=true;return}var label=row.slice(0,at).trim(),parts=row.slice(at+1).trim().split(':');if(!label||parts.length>3||!parts.every(function(v){return /^\d+$/.test(v)})){bad=true;return}var seconds=parts.reduce(function(a,b){return a*60+Number(b)},0);if(seconds>86400){bad=true;return}out.push({label:label.slice(0,35),start:seconds})});
if(bad){toast('格式錯誤，請按照：第一樂章=00:00; 第二樂章=09:30');return}out.sort(function(a,b){return a.start-b.start});t.chapters=out;persistLibrary();display();toast(out.length?'已標記 '+out.length+' 個樂章；新房間可自動使用':'已清除樂章標記')}

async function importLibraryFile(input){var file=input.files&&input.files[0];if(!file)return;try{var obj=JSON.parse(await file.text()),songs=Array.isArray(obj)?obj:obj.tracks;if(!Array.isArray(songs))throw new Error('格式不符');var n=saveAddedTracks(songs);if(obj&&obj.clipPrefs&&typeof obj.clipPrefs==='object'&&!Array.isArray(obj.clipPrefs)){Object.keys(obj.clipPrefs).forEach(function(id){if(/^[a-zA-Z0-9_-]{11}$/.test(id)){var pref=safeClipPref(obj.clipPrefs[id]);if(pref)APP.clipPrefs[id]=pref}});persistClipPrefs()}toast('已從備份匯入 '+n+' 首新歌曲及精華片段設定')}catch(e){toast('匯入失敗：請確認是 MIND FM JSON 備份')}finally{input.value=''}}
function getPlaylistId(raw){try{var u=new URL(raw),host=u.hostname.toLowerCase().replace(/^www\./,'');if(!['youtube.com','m.youtube.com','music.youtube.com','youtu.be'].includes(host))return null;var id=u.searchParams.get('list');return id&&/^[a-zA-Z0-9_-]{10,80}$/.test(id)?id:null}catch(e){return null}}
